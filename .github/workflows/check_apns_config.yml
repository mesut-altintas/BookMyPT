name: Check APNs Configuration

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: pip3 install PyJWT cryptography

      - name: Check Apple Developer Portal — Push Notifications capability
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Write private key
          echo "$ASC_PRIVATE_KEY" > /tmp/asc_key.p8

          # Generate JWT
          python3 - <<'PYEOF'
          import jwt, time, subprocess, json, sys, os

          key_id     = os.environ["ASC_KEY_ID"]
          issuer_id  = os.environ["ASC_ISSUER_ID"]
          key_path   = "/tmp/asc_key.p8"

          with open(key_path) as f:
              private_key = f.read()

          now = int(time.time())
          payload = {"iss": issuer_id, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

          import urllib.request
          url = "https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=com.bookmypt&include=bundleIdCapabilities&fields[bundleIdCapabilities]=capabilityType,settings"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())

          print("\n=== BUNDLE ID ===")
          for item in data.get("data", []):
              print(f"ID: {item['id']}, Name: {item['attributes']['name']}, Platform: {item['attributes']['platform']}")

          print("\n=== CAPABILITIES ===")
          for inc in data.get("included", []):
              cap = inc["attributes"]["capabilityType"]
              print(f"  ✓ {cap}")

          caps = [inc["attributes"]["capabilityType"] for inc in data.get("included", [])]
          if "PUSH_NOTIFICATIONS" in caps:
              print("\n✅ PUSH_NOTIFICATIONS: AKTIF")
          else:
              print("\n❌ PUSH_NOTIFICATIONS: YOK veya ETKİN DEĞİL")
          PYEOF

      - name: Check Firebase APNs Auth Key via Management API
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Firebase Management API - APNs certificate list
          # Get a Google access token via gcloud (using firebase token from environment)
          # Try fetching with the existing Firebase OAuth token (may be expired)
          echo "Checking Firebase project iOS app APNs keys..."

          # Use App Store Connect to list APNs keys
          python3 - <<'PYEOF'
          import jwt, time, json, os
          import urllib.request, urllib.error

          key_id     = os.environ["ASC_KEY_ID"]
          issuer_id  = os.environ["ASC_ISSUER_ID"]
          key_path   = "/tmp/asc_key.p8"

          with open(key_path) as f:
              private_key = f.read()

          now = int(time.time())
          payload = {"iss": issuer_id, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
          token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

          # List all keys in the account (includes APNs keys)
          url = "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DEVELOPMENT,DISTRIBUTION,IOS_DEVELOPMENT,IOS_DISTRIBUTION"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())

          print("\n=== CERTIFICATES ===")
          for cert in data.get("data", []):
              attrs = cert["attributes"]
              print(f"  {attrs['certificateType']}: {attrs['displayName']} (expires: {attrs.get('expirationDate','?')})")

          PYEOF
