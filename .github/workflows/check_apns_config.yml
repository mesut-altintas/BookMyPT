name: Check APNs Configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check_apns_config.yml'
      - 'scripts/check_apns.py'

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install PyJWT cryptography --break-system-packages

      - name: Run check
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" | sed 's/\\n/\n/g' > /tmp/asc_key.p8
          python3 scripts/check_apns.py
