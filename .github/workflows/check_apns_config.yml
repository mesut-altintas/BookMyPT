name: Check APNs Configuration

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Install dependencies
        run: pip3 install PyJWT cryptography --break-system-packages

      - name: Check Apple Developer Portal
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Write private key — handle both \n and real newlines
          printf '%s' "$ASC_PRIVATE_KEY" | sed 's/\\n/\n/g' > /tmp/asc_key.p8
          echo "" >> /tmp/asc_key.p8

          python3 - <<'PYEOF'
import jwt, time, json, os
import urllib.request, urllib.error

key_id    = os.environ["ASC_KEY_ID"]
issuer_id = os.environ["ASC_ISSUER_ID"]

with open("/tmp/asc_key.p8") as f:
    private_key = f.read().strip()

now = int(time.time())
payload = {"iss": issuer_id, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}
token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

headers = {"Authorization": f"Bearer {token}"}

# 1. Bundle ID + capabilities
url = "https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=com.bookmypt&include=bundleIdCapabilities&fields[bundleIdCapabilities]=capabilityType"
req = urllib.request.Request(url, headers=headers)
data = json.loads(urllib.request.urlopen(req).read())

print("\n=== BUNDLE ID ===")
for item in data.get("data", []):
    a = item["attributes"]
    print(f"  {a['name']} | {a['identifier']} | {a['platform']}")

print("\n=== CAPABILITIES ===")
caps = []
for inc in data.get("included", []):
    cap = inc["attributes"]["capabilityType"]
    caps.append(cap)
    print(f"  ✓ {cap}")

if "PUSH_NOTIFICATIONS" in caps:
    print("\n✅ PUSH_NOTIFICATIONS: AKTİF")
else:
    print("\n❌ PUSH_NOTIFICATIONS: EKSİK!")

# 2. APNs keys in the account
print("\n=== APNs AUTH KEYS ===")
try:
    url2 = "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities"
    # List keys (different endpoint)
    url2 = "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=IOS_DISTRIBUTION,DISTRIBUTION"
    req2 = urllib.request.Request(url2, headers=headers)
    data2 = json.loads(urllib.request.urlopen(req2).read())
    for cert in data2.get("data", []):
        a = cert["attributes"]
        print(f"  {a['certificateType']}: {a['displayName']} (exp: {a.get('expirationDate','?')[:10]})")
except Exception as e:
    print(f"  Error: {e}")
PYEOF
