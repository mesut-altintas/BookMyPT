name: Android Build & Play Store

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # ── 4. Firebase config ───────────────────────────────────────────────
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo -n "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      # ── 5. Signing setup ──────────────────────────────────────────────────
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/bookmypt-release.jks

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=bookmypt-release.jks
          EOF
          # Strip leading spaces (heredoc indentation)
          sed -i 's/^[[:space:]]*//' android/key.properties

      # ── 6. Build AAB ──────────────────────────────────────────────────────
      - name: Build Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }}

      # ── 7. Upload to Play Store (Internal track) ──────────────────────────
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bookmypt
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
